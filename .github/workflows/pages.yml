name: Publish Fortune guide demonstration

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "guide-core.js"
      - "app.js"
      - "site.js"
      - "config.js"
      - "calendar-source.json"
      - "site-index.json"
      - "replica-manifest.json"
      - "replica-snapshots/**"
      - "replica-shell.css"
      - "replica-shell.js"
      - "embed-frame.js"
      - "server.py"
      - "tests/**"
      - "run.sh"
      - "scripts/build_pages.py"
      - "scripts/capture_replica.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public demonstration source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pinned Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run source, privacy, and route contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./run.sh test

      - name: Build and validate allowlisted site
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/build_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
